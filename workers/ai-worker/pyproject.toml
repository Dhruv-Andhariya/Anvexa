[project]
name = "ai-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "google-genai>=2.29.0",
    "pyyaml>=6.0.3",
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # ai_worker is not an installed package; make it importable from tests
markers = ["integration: calls the real LLM provider (opt-in: RUN_LLM_INTEGRATION=1)"]
