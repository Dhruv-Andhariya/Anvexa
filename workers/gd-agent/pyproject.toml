[project]
name = "gd-agent"
version = "0.1.0"
description = "M18 AI group discussion: LiveKit moderator bot, Whisper transcription, rubric evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "faster-whisper>=1.1",
    # PyAV 15+ dropped open(metadata_errors=...), which faster-whisper 1.2 still passes
    "av>=14.2,<14.3",
    "livekit-agents>=1.2",
    "piper-tts>=1.2",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
# never compile native packages on Windows laptops: pick versions that ship wheels
no-build-package = ["av", "ctranslate2", "onnxruntime"]
