[project]
name = "aaie-worker"
version = "0.1.0"
description = "AAIE (Anvexa Assessment Intelligence Engine) evaluation worker for DSA + SQL rounds"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    # Phase 2: DSA logic band (same SDK and minimum version as workers/ai-worker)
    "google-genai>=2.29.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.8"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # `app` is not an installed package; make it importable from tests
